name: Daily Weather ETL Pipeline

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  # Allows manual triggering from GitHub Actions web interface
  workflow_dispatch:

jobs:
  run-etl:
    name: Execute Weather ETL Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          # Reads connection details from GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LOG_LEVEL: INFO
        run: python main.py
